<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Data Punch - Pro</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-tools"></i> Punch Management</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" id="nav-dashboard" href="#" onclick="switchPage('dashboard')">
                            <i class="bi bi-speedometer2"></i> Dashboard & List
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="nav-form" href="#" onclick="switchPage('form')">
                            <i class="bi bi-plus-circle"></i> Input Punch Baru
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">

        <!-- HALAMAN 1: DASHBOARD & LIST -->
        <div id="page-dashboard" class="content-page">
            
            <!-- Cards Statistik -->
            <div class="row mb-4">
                <div class="col-md-3 mb-3">
                    <div class="card text-white bg-primary shadow-sm">
                        <div class="card-body">
                            <h6 class="card-title text-uppercase">Total Punch</h6>
                            <h2 class="fw-bold mb-0" id="val-total">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="card text-white bg-success shadow-sm">
                        <div class="card-body">
                            <h6 class="card-title text-uppercase">Ready</h6>
                            <h2 class="fw-bold mb-0" id="val-ready">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="card text-white bg-warning shadow-sm">
                        <div class="card-body">
                            <h6 class="card-title text-uppercase text-dark">Repair</h6>
                            <h2 class="fw-bold mb-0 text-dark" id="val-repair">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 mb-3">
                    <div class="card text-white bg-danger shadow-sm">
                        <div class="card-body">
                            <h6 class="card-title text-uppercase">Rusak</h6>
                            <h2 class="fw-bold mb-0" id="val-rusak">0</h2>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabel List & Search Bar -->
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3 d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
                    <h5 class="mb-0 fw-bold"><i class="bi bi-list-task"></i> Daftar List Punch</h5>
                    
                    <!-- Search Bar & Tombol Tambah -->
                    <div class="d-flex align-items-center gap-2 w-100 w-md-auto justify-content-end">
                        <div class="input-group input-group-sm" style="max-width: 250px;">
                            <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                            <input type="text" id="searchInput" class="form-control" placeholder="Cari size / motif..." onkeyup="filterTable()">
                        </div>
                        <button class="btn btn-primary btn-sm text-nowrap" onclick="switchPage('form')">
                            <i class="bi bi-plus"></i> Tambah
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Size</th>
                                    <th>Motif / Polos</th>
                                    <th>Kondisi</th>
                                    <th>Counter Punch</th>
                                    <th>Tanggal Terakhir Pakai</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="table-body">
                                <tr>
                                    <td colspan="7" class="text-center py-4 text-muted">Memuat data dari Google Sheets...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- HALAMAN 2: FORM INPUT -->
        <div id="page-form" class="content-page d-none">
            <div class="row justify-content-center">
                <div class="col-md-7">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0"><i class="bi bi-file-earmark-plus"></i> Form Input Punch</h5>
                            <button class="btn btn-sm btn-light text-primary fw-bold" onclick="switchPage('dashboard')">
                                <i class="bi bi-arrow-left"></i> Kembali
                            </button>
                        </div>
                        <div class="card-body">
                            <form id="formPunch" onsubmit="submitData(event)">
                                
                                <div class="mb-3">
                                    <label for="size" class="form-label">Size</label>
                                    <input type="text" class="form-control" id="size" name="size" placeholder="Contoh: 10mm / M12" required>
                                </div>

                                <div class="mb-3">
                                    <label for="motif_polos" class="form-label">Motif / Polos</label>
                                    <select class="form-select" id="motif_polos" name="motif_polos" required>
                                        <option value="" selected disabled>Pilih Tipe...</option>
                                        <option value="Polos">Polos</option>
                                        <option value="Motif">Motif</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="kondisi" class="form-label">Kondisi</label>
                                    <select class="form-select" id="kondisi" name="kondisi" required>
                                        <option value="" selected disabled>Pilih Kondisi...</option>
                                        <option value="Ready">Ready</option>
                                        <option value="Repair">Repair</option>
                                        <option value="Rusak">Rusak</option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="counter_punch" class="form-label">Counter Punch</label>
                                    <input type="number" class="form-control" id="counter_punch" name="counter_punch" placeholder="Masukkan jumlah counter" required>
                                </div>

                                <div class="mb-3">
                                    <label for="tanggal_pakai" class="form-label">Tanggal Terakhir Pakai</label>
                                    <input type="date" class="form-control" id="tanggal_pakai" name="tanggal_pakai" required>
                                </div>

                                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                    <button type="button" class="btn btn-secondary me-md-2" onclick="switchPage('dashboard')">Batal</button>
                                    <button type="submit" id="btnSimpan" class="btn btn-primary">Simpan ke Google Sheets</button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- TOAST NOTIFICATION CONTAINER (Pojok Kanan Bawah) -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="liveToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">
                    Pesan notifikasi di sini...
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script Utama -->
    <script>
        const SCRIPT_URL = "URL_WEB_APP_ANDA_DISINI";
        let allDataGlobal = []; // Menyimpan data untuk fitur pencarian

        window.onload = function() {
            loadDashboardData();
        };

        // Fungsi Toast Notification modern
        function showToast(message, type = 'success') {
            const toastEl = document.getElementById('liveToast');
            const toastMsg = document.getElementById('toastMessage');
            
            toastMsg.innerText = message;
            toastEl.className = `toast align-items-center text-white border-0 bg-${type}`;
            
            const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
            toast.show();
        }

        // Ambil data dari Google Sheets
        function loadDashboardData() {
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data...</td></tr>`;

            fetch(SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    allDataGlobal = data; // Simpan data mentah
                    renderTable(allDataGlobal);
                    updateCounters(allDataGlobal);
                })
                .catch(error => {
                    console.error('Error:', error);
                    tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-danger">Gagal memuat data. Periksa kembali URL Web App Anda.</td></tr>`;
                });
        }

        // Render tabel berdasarkan data
        function renderTable(data) {
            const tableBody = document.getElementById('table-body');
            let html = '';

            if (data.length === 0) {
                html = `<tr><td colspan="7" class="text-center py-4 text-muted">Tidak ada data punch yang ditemukan.</td></tr>`;
            } else {
                data.forEach((item, index) => {
                    let cond = item.kondisi ? item.kondisi.trim().toLowerCase() : '';
                    let badgeClass = 'bg-secondary';
                    if (cond === 'ready') badgeClass = 'bg-success';
                    else if (cond === 'repair') badgeClass = 'bg-warning text-dark';
                    else if (cond === 'rusak') badgeClass = 'bg-danger';

                    let tglPakai = item.tanggalPakai ? item.tanggalPakai.split('T')[0] : '-';
                    let formattedCounter = !isNaN(item.counterPunch) ? Number(item.counterPunch).toLocaleString() : item.counterPunch;

                    html += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${item.size}</td>
                            <td>${item.motifPolos}</td>
                            <td><span class="badge ${badgeClass}">${item.kondisi}</span></td>
                            <td>${formattedCounter}</td>
                            <td>${tglPakai}</td>
                            <td>
                                <button class="btn btn-sm btn-warning text-white" title="Edit"><i class="bi bi-pencil-square"></i></button>
                                <button class="btn btn-sm btn-danger" title="Hapus"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            }
            tableBody.innerHTML = html;
        }

        // Hitung statistik kartu dashboard
        function updateCounters(data) {
            let total = data.length;
            let ready = 0, repair = 0, rusak = 0;

            data.forEach(item => {
                let cond = item.kondisi ? item.kondisi.trim().toLowerCase() : '';
                if (cond === 'ready') ready++;
                else if (cond === 'repair') repair++;
                else if (cond === 'rusak') rusak++;
            });

            document.getElementById('val-total').innerText = total;
            document.getElementById('val-ready').innerText = ready;
            document.getElementById('val-repair').innerText = repair;
            document.getElementById('val-rusak').innerText = rusak;
        }

        // Fitur Search Bar Real-time
        function filterTable() {
            let keyword = document.getElementById('searchInput').value.toLowerCase();
            let filteredData = allDataGlobal.filter(item => {
                let size = String(item.size).toLowerCase();
                let motif = String(item.motifPolos).toLowerCase();
                let kondisi = String(item.kondisi).toLowerCase();
                return size.includes(keyword) || motif.includes(keyword) || kondisi.includes(keyword);
            });
            renderTable(filteredData);
        }

        // Kirim data baru via AJAX
        function submitData(event) {
            event.preventDefault();
            
            const btnSimpan = document.getElementById('btnSimpan');
            btnSimpan.disabled = true;
            btnSimpan.innerHTML = "Menyimpan...";

            const formData = new URLSearchParams(new FormData(document.getElementById('formPunch')));

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData,
                redirect: 'follow'
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    showToast("Data berhasil disimpan ke Google Sheets!", "success");
                    document.getElementById('formPunch').reset();
                    switchPage('dashboard');
                } else {
                    showToast("Gagal: " + data.message, "danger");
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showToast("Terjadi kesalahan koneksi saat mengirim data.", "danger");
            })
            .finally(() => {
                btnSimpan.disabled = false;
                btnSimpan.innerHTML = "Simpan ke Google Sheets";
            });
        }

        // Navigasi Tab / Halaman
        function switchPage(page) {
            const pageDashboard = document.getElementById('page-dashboard');
            const pageForm = document.getElementById('page-form');
            const navDashboard = document.getElementById('nav-dashboard');
            const navForm = document.getElementById('nav-form');

            if (page === 'dashboard') {
                pageDashboard.classList.remove('d-none');
                pageForm.classList.add('d-none');
                navDashboard.classList.add('active');
                navForm.classList.remove('active');
                loadDashboardData();
            } else if (page === 'form') {
                pageForm.classList.remove('d-none');
                pageDashboard.classList.add('d-none');
                navForm.classList.add('active');
                navDashboard.classList.remove('active');
            }
        }
    </script>
</body>
</html>
